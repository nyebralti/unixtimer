
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canlı Unix Time</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    font-family: system-ui, sans-serif;
    color: #eef3ff;
    background: radial-gradient(
        ellipse at top,
        #182747,
        #090d18 70%
    );
}

.card {
    width: min(100%, 550px);
    padding: 28px;
    background: #121a2b;
    border: 1px solid #26334d;
    border-radius: 22px;
    box-shadow: 0 20px 70px #0006;
    text-align: center;
}

.icon {
    font-size: 48px;
}

h1 {
    font-size: 30px;
    margin: 10px 0;
}

.subtitle {
    color: #9baac4;
    margin-bottom: 30px;
}

.output {
    background: #0b1220;
    border: 1px solid #26334d;
    border-radius: 15px;
    padding: 22px;
    margin-top: 15px;
}

.label {
    color: #9baac4;
    font-size: 14px;
    margin-bottom: 12px;
}

.value {
    color: #65dfb0;
    font-family: monospace;
    font-size: clamp(22px, 5vw, 30px);
    font-weight: bold;
    overflow-wrap: anywhere;
}

.live {
    color: #65dfb0;
    font-size: 13px;
    margin-top: 22px;
}

footer {
    color: #687995;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">⌚</div>

    <h1>Canlı Unix Time</h1>

    <p class="subtitle">
        Güncel tarih, saat ve Unix Timestamp
    </p>

    <div class="output">

        <div class="label">
            Şu anki tarih ve saat
        </div>

        <div class="value" id="date">
            Yükleniyor...
        </div>

    </div>

    <div class="output">

        <div class="label">
            Unix Time (saniye)
        </div>

        <div class="value" id="unix">
            Yükleniyor...
        </div>

    </div>

    <div class="live">
        ● CANLI GÜNCELLEME
    </div>

    <footer>
        Her saniye otomatik güncellenir.
    </footer>

</div>

<script>

function updateClock() {

    const now = new Date();

    document.getElementById("date").textContent =
        now.toLocaleString("tr-TR", {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        });

    document.getElementById("unix").textContent =
        Math.floor(Date.now() / 1000);

}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
